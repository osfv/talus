[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nullscape"
version = "0.1.0"
description = "Learned terrain generation research for the NULLSCAPE game"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "torch>=2.7",
    "matplotlib>=3.8",
    "pillow>=10",
    "pyyaml>=6",
    "tqdm>=4.66",
    "tensorboard>=2.15",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
nullscape = "nullscape.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["gpu: requires a CUDA device", "slow: longer-running tests"]
