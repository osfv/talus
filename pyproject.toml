[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nullscape"
version = "0.3.0"
description = "Talus: a conditional diffusion model for game terrain heightmaps, plus its data and benchmark code"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "torch>=2.7",
    "matplotlib>=3.8",
    "pillow>=10",
    "pyyaml>=6",
    "tqdm>=4.66",
    "tensorboard>=2.15",
]

[project.optional-dependencies]
dev = ["pytest>=8", "tifffile>=2026.9.15"]
earth = ["tifffile>=2026.9.15"]  # real-terrain datasets (nullscape.data.earth)
web = ["onnx>=1.23.1", "onnxruntime>=1.30"]  # scripts/export_web.py: the browser model for talus.tersa.tech

[project.scripts]
nullscape = "nullscape.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
nullscape = ["eval/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["gpu: requires a CUDA device", "slow: longer-running tests"]
