# Small real-terrain sample (16 hand-picked Copernicus GLO-30 tiles, about 0.6 GB download) at the Talus
# scale (64 x 64 cells of 64 m = 4.1 km). Used to validate the pipeline and to eyeball real vs procedural
# terrain. Build: python -m nullscape.data.earth build --config configs/dataset/earth64_sample.yaml
# Every 1-degree tile is its own split block here, so val/test are whole unseen regions.
name: earth64_sample
seed: 11
source:
  tiles:
    - Copernicus_DSM_COG_10_N47_00_E019_00_DEM   # Hungary: Great Plain, Danube, Matra hills
    - Copernicus_DSM_COG_10_N46_00_E010_00_DEM   # Alps: Bernina, Ortler
    - Copernicus_DSM_COG_10_N45_00_E007_00_DEM   # Alps: Valais, Matterhorn
    - Copernicus_DSM_COG_10_N43_00_E016_00_DEM   # Dalmatian coast and islands
    - Copernicus_DSM_COG_10_N27_00_E086_00_DEM   # Himalaya: Everest
    - Copernicus_DSM_COG_10_N36_00_W113_00_DEM   # Grand Canyon
    - Copernicus_DSM_COG_10_N63_00_W020_00_DEM   # Iceland: Hekla (2x longitude spacing)
    - Copernicus_DSM_COG_10_N19_00_W156_00_DEM   # Hawaii: Mauna Kea
    - Copernicus_DSM_COG_10_S34_00_W071_00_DEM   # Andes near Santiago
    - Copernicus_DSM_COG_10_N35_00_E138_00_DEM   # Mt Fuji
    - Copernicus_DSM_COG_10_N30_00_E031_00_DEM   # Nile delta and desert
    - Copernicus_DSM_COG_10_N68_00_E017_00_DEM   # Norwegian fjords
    - Copernicus_DSM_COG_10_S26_00_E131_00_DEM   # Uluru, central Australia
    - Copernicus_DSM_COG_10_N39_00_W106_00_DEM   # Colorado Rockies
    - Copernicus_DSM_COG_10_N28_00_W017_00_DEM   # Tenerife
    - Copernicus_DSM_COG_10_N53_00_W005_00_DEM   # Snowdonia (1.5x longitude spacing)
world:
  resolution: 64
  extent_m: 4096.0
  max_height_m: 9500.0
datum_offset_m: 500.0
sea_threshold_m: 0.5
windows_per_tile: 64
filters: {max_water_fraction: 0.9, min_relief_m: 1.0, max_clipped_fraction: 0.001}
splits:
  fractions: {train: 0.6, val: 0.2, test: 0.2}
  block_deg: 1
