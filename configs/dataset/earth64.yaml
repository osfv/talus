# Full real-terrain dataset at the Talus scale (64 x 64 cells of 64 m = 4.1 km), for Talus-3.x/4 experiments
# on real Earth terrain. 1500 random 1-degree Copernicus GLO-30 tiles between 60S and 72N, up to 34 windows each
# (about 50k maps). Downloads about 59 GB into the DEM cache (outside OneDrive), so the limit must be raised:
#   python -m nullscape.data.earth tiles --config configs/dataset/earth64.yaml
#   python -m nullscape.data.earth build --config configs/dataset/earth64.yaml --max-gb 70 --workers 4
# earth256.yaml selects the same tiles, so both datasets share one download.
name: earth64
seed: 20260927
source:
  sample_tiles: 1500
  lat_range: [-60, 72]
world:
  resolution: 64
  extent_m: 4096.0
  max_height_m: 9500.0
datum_offset_m: 500.0
sea_threshold_m: 0.5
windows_per_tile: 34
filters: {max_water_fraction: 0.9, min_relief_m: 1.0, max_clipped_fraction: 0.001}
splits:
  fractions: {train: 0.9, val: 0.05, test: 0.05}
  block_deg: 5
