# Talus-3.1 step-count test: nullscape queue --plan configs/queue/talus31_fresh12k.yaml
# Same baseline, VAL maps and seeds as talus31_fresh.yaml, so the numbers line up with the 5k fresh run.
name: talus31_fresh12k
baseline:
  name: Talus-3
  checkpoint: runs/20260927-184009_talus3_control/checkpoints/last.pt
checkpoint: last
evaluation:
  dataset: base64
  split: val
  n: 500
  seed: 7
  batch_size: 64
  modes: conditional
  gameplay_n: 128
  memorization: true
  gpu_memory_fraction: 0.6
  sampling: {steps: 50, spacing: quadratic, guidance: 2.0, eta: 0.0, guidance_interval: [0.0, 1.0]}
experiments:
  - name: talus31-fresh-12k
    config: configs/train/talus31_fresh_12k.yaml
